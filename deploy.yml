name: OCC Live Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  safety-check:
    name: Pre-Deployment Safety Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Safety Tests
        run: npm run test:safety

      - name: Verify Security Steering Rule Exists
        run: test -f .kiro/steering/occ-live-security.md

      - name: Verify Consent System
        run: |
          test -f src/systems/interaction-consent-manager.ts
          test -f src/systems/consent-screen.ts
          test -f src/systems/personal-space.ts
          test -f src/types/consent.ts

  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: safety-check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
